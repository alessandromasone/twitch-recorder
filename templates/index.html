<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token_value }}">
  <meta name="color-scheme" content="dark light">
  <title>Twitch Recorder</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=static_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=static_v) }}">
  <script>try{const t=localStorage.getItem("tr-theme");if(t)document.documentElement.dataset.theme=t;if(localStorage.getItem("tr-covers-off")==="1")document.documentElement.classList.add("covers-off");}catch(e){}</script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17v.5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M3 15h18M8 5v14M16 5v14"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-volume-x" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
    <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.6C3.8 8.3 2 12 2 12s3.5 6.5 10 6.5c1.8 0 3.3-.5 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand"><span class="brand-tally" aria-hidden="true"></span>Twitch Recorder</div>
  <div class="bus" aria-live="polite">
    <span class="bus-item bus-air" title="Canali in diretta"><b id="sOnline">0</b> in onda</span>
    <span class="bus-item bus-rec" title="Registrazioni attive"><b id="sRec">0</b> in REC</span>
    <span class="bus-item bus-rerun" id="sRerunWrap" hidden title="Live segnalate come possibili rerun"><b id="sRerun">0</b> rerun?</span>
  </div>
  <div class="disk" id="disk" title="Spazio su disco">
    <div class="disk-bar"><div class="disk-fill" id="diskFill"></div></div>
    <span id="diskText">—</span>
  </div>
  <div class="top-actions">
    <span class="health" id="health" title="Stato del monitor"><span class="health-dot"></span><span id="healthText">Avvio…</span></span>
    <button class="icon-btn panic-btn" type="button" data-cmd="panic" aria-pressed="false" title="Nascondi copertine e video (h)" aria-label="Nascondi copertine e video"><svg><use href="#i-eye"/></svg></button>
    <button class="icon-btn" type="button" data-cmd="check-all" title="Controlla subito tutti i canali" aria-label="Controlla tutti i canali"><svg><use href="#i-refresh"/></svg></button>
    <button class="icon-btn" type="button" data-cmd="settings" title="Impostazioni e strumenti" aria-label="Impostazioni"><svg><use href="#i-gear"/></svg></button>
    <button class="icon-btn" type="button" data-cmd="theme" title="Cambia tema" aria-label="Cambia tema"><svg><use href="#i-contrast"/></svg></button>
    {% if login_enabled %}
    <form action="{{ url_for('logout') }}" method="post" class="inline-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
      <button class="icon-btn" type="submit" title="Esci" aria-label="Esci"><svg><use href="#i-logout"/></svg></button>
    </form>
    {% endif %}
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sezioni">
  <button type="button" role="tab" class="tab" data-tab="channels" aria-selected="true">Canali <span id="tabChCount"></span></button>
  <button type="button" role="tab" class="tab" data-tab="recordings" aria-selected="false">Registrazioni <span id="tabRecCount"></span></button>
</nav>

<div class="layout" data-view="channels">
  <main class="col-main" id="colChannels">
    <div class="toolbar">
      <form class="add" id="addForm" autocomplete="off">
        <select id="addPlatform" aria-label="Piattaforma"></select>
        <input id="addChannel" type="text" placeholder="Nome canale o link" aria-label="Nome canale o link" spellcheck="false">
        <select id="addQuality" aria-label="Qualità"></select>
        <button class="btn btn-primary" type="submit"><svg><use href="#i-plus"/></svg><span>Aggiungi</span></button>
      </form>
      <div class="finder">
        <label class="search"><svg><use href="#i-search"/></svg><input type="search" id="search" placeholder="Cerca canale, titolo, gioco" aria-label="Cerca" spellcheck="false"><kbd>/</kbd></label>
        <select id="sort" aria-label="Ordina">
          <option value="default">Priorità</option>
          <option value="name">Nome</option>
          <option value="last_live">Ultima live</option>
          <option value="viewers">Spettatori</option>
          <option value="last_checked">Ultimo controllo</option>
        </select>
        <button class="btn btn-ghost" type="button" data-cmd="select-mode" aria-pressed="false" title="Seleziona più canali"><svg><use href="#i-select"/></svg><span>Seleziona</span></button>
        <button class="btn btn-primary add-toggle" type="button" data-cmd="toggle-add" aria-expanded="false" title="Aggiungi un canale"><svg><use href="#i-plus"/></svg><span>Aggiungi</span></button>
      </div>
      <div class="chips" id="chips" role="radiogroup" aria-label="Filtro"></div>
    </div>

    <section class="wall-section" id="wallSection" hidden>
      <h2 class="section-title">In onda</h2>
      <div class="wall" id="wall"></div>
    </section>

    <section class="list-section" id="listSection">
      <h2 class="section-title" id="listTitle">Canali</h2>
      <div class="rows" id="rows"></div>
    </section>
    <div class="empty" id="emptyChannels" hidden></div>
  </main>

  <aside class="col-side" id="colRecordings">
    <div class="side-head">
      <h2 class="section-title">Registrazioni <span class="muted" id="recTotal"></span></h2>
      <label class="search small"><svg><use href="#i-search"/></svg><input type="search" id="recSearch" placeholder="Filtra file" aria-label="Filtra registrazioni" spellcheck="false"></label>
    </div>
    <div class="recs" id="recs"></div>
  </aside>
</div>

<div class="bulkbar" id="bulkbar" hidden>
  <span id="bulkCount">0 selezionati</span>
  <button class="btn btn-ghost" type="button" id="bulkAll" data-cmd="select-all" aria-pressed="false">Seleziona tutti</button>
  <button class="btn btn-ghost" type="button" data-bulk="resume">Registra</button>
  <button class="btn btn-ghost" type="button" data-bulk="pause">Pausa</button>
  <button class="btn btn-ghost" type="button" data-bulk="sleep">Metti a dormire</button>
  <button class="btn btn-ghost" type="button" data-bulk="wake">Risveglia</button>
  <button class="btn btn-ghost" type="button" data-bulk="check">Controlla</button>
  <select id="bulkQuality" aria-label="Imposta qualità"><option value="">Qualità…</option></select>
  <select id="bulkRerun" aria-label="Politica rerun">
    <option value="">Rerun…</option>
    <option value="default">Predefinita</option>
    <option value="mark">Registra e segna</option>
    <option value="skip">Salta</option>
    <option value="record">Ignora</option>
  </select>
  <button class="btn btn-danger" type="button" data-bulk="remove">Rimuovi</button>
  <button class="icon-btn" type="button" data-cmd="select-mode" aria-label="Chiudi selezione"><svg><use href="#i-x"/></svg></button>
</div>

<!-- Pannello laterale: dettaglio canale / impostazioni -->
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-cmd="close-drawer"></div>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="icon-btn" type="button" data-cmd="close-drawer" aria-label="Chiudi"><svg><use href="#i-x"/></svg></button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </section>
</div>

<!-- Player -->
<div class="player" id="player" aria-hidden="true">
  <div class="player-box" id="playerBox" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
    <header class="player-top" id="playerTop">
      <button class="pt-btn" type="button" data-cmd="close-player" aria-label="Chiudi il player"><svg><use href="#i-chevron-down"/></svg></button>
      <div class="pt-chan"><span class="pt-tag" id="ptTag"></span><span class="pt-name" id="ptName"></span></div>
      <span class="pt-grip" aria-hidden="true"></span>
    </header>
    <div class="player-stage" id="playerStage">
      <video id="video" playsinline webkit-playsinline preload="auto"></video>
      <span class="pc-seekfx left" id="fxBack" aria-hidden="true">−10 s</span>
      <span class="pc-seekfx right" id="fxFwd" aria-hidden="true">+10 s</span>
      <button class="pc-unmute" type="button" id="pcUnmute" hidden><svg><use href="#i-volume-x"/></svg><span>Tocca per l'audio</span></button>
      <div class="player-status" id="playerStatus">
        <span class="spinner"></span><span id="playerStatusText">Caricamento…</span>
        <button class="btn" type="button" id="playerRetry" hidden>Riprova</button>
      </div>
      <button class="pc-big" type="button" id="pcBig" aria-label="Riproduci"><svg><use href="#i-play"/></svg></button>
      <div class="pc" id="pc">
        <input class="pc-seek" type="range" id="pcSeek" min="0" max="1000" value="0" step="1" aria-label="Posizione nel file">
        <div class="pc-bar">
          <button class="pc-btn pc-play" type="button" id="pcPlay" aria-label="Riproduci"><svg><use href="#i-play"/></svg></button>
          <div class="pc-volume">
            <button class="pc-btn" type="button" id="pcMute" aria-label="Disattiva l'audio"><svg><use href="#i-volume"/></svg></button>
            <input type="range" id="pcVol" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
          </div>
          <button class="pc-live" type="button" id="pcLive">In diretta</button>
          <span class="pc-time" id="pcTime"></span>
          <span class="pc-spacer"></span>
          <button class="pc-btn" type="button" id="pcPip" aria-label="Picture in picture" title="Picture in picture"><svg><use href="#i-pip"/></svg></button>
          <button class="pc-btn" type="button" id="pcFull" aria-label="Schermo intero" title="Schermo intero (f)"><svg><use href="#i-maximize"/></svg></button>
        </div>
      </div>
    </div>
    <footer class="player-info">
      <span class="avatar" id="playerAvatar" hidden></span>
      <div class="player-text">
        <h2 id="playerTitle"></h2>
        <p id="playerSub"></p>
      </div>
      <div class="player-actions">
        <button class="icon-btn" type="button" id="playerDetails" title="Dettagli del canale" aria-label="Dettagli del canale" hidden><svg><use href="#i-sliders"/></svg><span>Dettagli</span></button>
        <a class="icon-btn" id="playerDownload" title="Scarica il file" aria-label="Scarica il file" hidden><svg><use href="#i-download"/></svg><span>Scarica</span></a>
        <a class="icon-btn" id="playerExternal" target="_blank" rel="noopener noreferrer" title="Apri sulla piattaforma" aria-label="Apri sulla piattaforma"><svg><use href="#i-external"/></svg><span id="playerExternalLabel">Apri</span></a>
        <button class="icon-btn pi-close" type="button" data-cmd="close-player" aria-label="Chiudi player" title="Chiudi (Esc)"><svg><use href="#i-x"/></svg></button>
      </div>
    </footer>
  </div>
</div>

<dialog class="confirm" id="confirm">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" value="cancel">Annulla</button>
      <button class="btn btn-danger" value="ok" id="confirmOk">Conferma</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="{{ url_for('static', filename='app.js', v=static_v) }}" defer></script>
</body>
</html>
