<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex,nofollow">
  <title>Accedi · Twitch Recorder</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=static_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=static_v) }}">
  <script>try{const t=localStorage.getItem("tr-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .gate { width: min(100%, 360px); text-align: center; }
    .gate-logo { width: 56px; height: 56px; border-radius: 15px; display: block; margin: 0 auto 18px; }
    .gate h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    .gate .lead { margin: 6px 0 28px; color: var(--muted); }
    .field-pw {
      display: flex; align-items: center; height: 50px; padding: 0 6px 0 16px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s;
    }
    .field-pw:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
    .field-pw.has-error { border-color: var(--tally-rec); }
    .field-pw input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0; font-size: 15px; outline: none; }
    .field-pw .icon-btn { width: 36px; height: 36px; flex: none; }
    .go {
      width: 38px; height: 38px; border-radius: 9px; border: 0; margin-left: 2px; flex: none; cursor: pointer;
      display: grid; place-items: center; background: var(--accent); color: #fff;
    }
    .go:hover { filter: brightness(1.1); }
    .go:disabled { opacity: .6; cursor: progress; }
    .go svg { width: 18px; height: 18px; }
    .msg { min-height: 40px; margin: 10px 2px 0; font-size: 13px; text-align: left; }
    .msg .err { color: var(--tally-rec); }
    .msg .warn { color: var(--tally-cue); }
    .foot { margin-top: 26px; font-size: 12.5px; color: var(--faint); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.6C3.8 8.3 2 12 2 12s3.5 6.5 10 6.5c1.8 0 3.3-.5 4.6-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>
  <main class="gate">
    <img class="gate-logo" src="{{ url_for('static', filename='favicon.svg', v=static_v) }}" alt="">
    <h1>Twitch Recorder</h1>
    <p class="lead">Inserisci la password per continuare.</p>
    <form action="{{ url_for('login') }}" method="post" id="loginForm" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label class="sr" for="password">Password</label>
      <div class="field-pw{% if error %} has-error{% endif %}">
        <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password"
               required autofocus spellcheck="false" {% if error %}aria-invalid="true" aria-describedby="msg"{% endif %}>
        <button class="icon-btn" type="button" id="togglePw" aria-label="Mostra la password" title="Mostra la password"><svg><use href="#i-eye"/></svg></button>
        <button class="go" type="submit" id="submitBtn" aria-label="Accedi" title="Accedi"><svg><use href="#i-arrow"/></svg></button>
      </div>
      <p class="msg" id="msg" aria-live="polite">{% if error %}<span class="err">{{ error }}</span>{% endif %}</p>
    </form>
    <p class="foot">Resti connesso per {{ session_hours }} ore su questo browser.</p>
  </main>
  <script>
    (() => {
      const input = document.getElementById("password");
      const toggle = document.getElementById("togglePw");
      const msg = document.getElementById("msg");
      const serverError = msg.innerHTML;
      toggle.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.querySelector("use").setAttribute("href", show ? "#i-eye-off" : "#i-eye");
        toggle.setAttribute("aria-label", show ? "Nascondi la password" : "Mostra la password");
        toggle.title = toggle.getAttribute("aria-label");
        input.focus();
      });
      const caps = (e) => {
        const on = e.getModifierState && e.getModifierState("CapsLock");
        msg.innerHTML = on ? '<span class="warn">Il blocco maiuscole è attivo.</span>' : serverError;
      };
      input.addEventListener("keydown", caps);
      input.addEventListener("keyup", caps);
      document.getElementById("loginForm").addEventListener("submit", (e) => {
        if (!input.value) { e.preventDefault(); input.focus(); return; }
        document.getElementById("submitBtn").disabled = true;
      });
    })();
  </script>
</body>
</html>
