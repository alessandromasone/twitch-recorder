<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex,nofollow">
  <title>Accesso · Twitch Recorder</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=static_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=static_v) }}">
  <script>try{const t=localStorage.getItem("tr-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login { width: min(100%, 380px); padding: 28px; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--panel); box-shadow: var(--shadow); }
    .login .brand { margin-bottom: 24px; }
    .login h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
    .login p { margin: 0 0 20px; color: var(--muted); }
    .login label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
    .login input { width: 100%; height: 42px; }
    .login .btn { width: 100%; height: 42px; justify-content: center; margin-top: 14px; }
    .login .error-box { margin-bottom: 16px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><span class="brand-tally" aria-hidden="true"></span>Twitch Recorder</div>
    <h1>Accedi</h1>
    <p>Inserisci la password del pannello.</p>
    {% if error %}<p class="error-box" role="alert">{{ error }}</p>{% endif %}
    <form action="{{ url_for('login') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn btn-primary" type="submit">Accedi</button>
    </form>
  </main>
</body>
</html>
