name: Release

# Si pubblica solo creando un tag di versione:  git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da ripubblicare (es. v2.0.0)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/twitch-recorder

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Versione
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag dell'immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.tag }}
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Note di rilascio dal CHANGELOG
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?([ ]|$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Vedi CHANGELOG.md." > notes.md
          printf '\n**Immagine Docker:** `%s:%s`\n' "${{ env.IMAGE }}" "$V" >> notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          body_path: notes.md
