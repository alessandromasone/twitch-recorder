name: Pulizia immagini

# Le build sostituiscono i tag (preview, latest) e lasciano in GHCR versioni senza tag:
# una volta a settimana si eliminano, tenendo le 10 più recenti. Le versioni con tag restano.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: twitch-recorder
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: "true"
