name: Preview

# Ogni push sul branch preview sostituisce l'unica immagine :preview (nessun tag per commit).
on:
  push:
    branches: [preview]
    paths-ignore: ["**.md", "LICENSE", ".env.example"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Push ravvicinati: resta solo la build più recente.
concurrency:
  group: preview
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/twitch-recorder

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push di :preview
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:preview
          build-args: APP_VERSION=preview-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=preview
          cache-to: type=gha,scope=preview,mode=max
