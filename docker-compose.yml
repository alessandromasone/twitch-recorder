services:
  twitch-recorder:
    image: ghcr.io/${GITHUB_USER:-alessandromasone}/twitch-recorder:latest
    build: .
    container_name: twitch-recorder
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - recorder-data:/data
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - APP_SESSION_HOURS=${APP_SESSION_HOURS:-12}
      - AUTO_CONVERT=${AUTO_CONVERT:-false}
      - DELETE_AFTER_CONVERT=${DELETE_AFTER_CONVERT:-false}
      - DEDUP_ENABLED=${DEDUP_ENABLED:-false}
      - DEDUP_BYTES=${DEDUP_BYTES:-2097152}
      - DEDUP_FILE=${DEDUP_FILE:-}
      - STREAM_QUALITY=${STREAM_QUALITY:-best}
      - SKIP_RERUNS=${SKIP_RERUNS:-false}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - SKIP_TWITCH_ADS=${SKIP_TWITCH_ADS:-true}
      - TWITCH_CHECK_METHOD=${TWITCH_CHECK_METHOD:-auto}
      - MIN_FREE_GB=${MIN_FREE_GB:-2}
      - HELIX_OFFLINE_CHECK_INTERVAL=${HELIX_OFFLINE_CHECK_INTERVAL:-20}
      - RERUN_DEFAULT_POLICY=${RERUN_DEFAULT_POLICY:-mark}
      - RERUN_SUSPECT_SCORE=${RERUN_SUSPECT_SCORE:-40}
      - RERUN_PROBABLE_SCORE=${RERUN_PROBABLE_SCORE:-70}
      - MINIMAL_UI=${MINIMAL_UI:-false}
      - RECORDING_THUMBS=${RECORDING_THUMBS:-}
      - PREVIEW_LINGER_SECONDS=${PREVIEW_LINGER_SECONDS:-10}
      - RECONNECT_WAIT=${RECONNECT_WAIT:-30}
      - RECONNECT_TRIES=${RECONNECT_TRIES:-3}
      - NOTIFY_TYPE=${NOTIFY_TYPE:-}
      - NOTIFY_EVENTS=${NOTIFY_EVENTS:-online,offline,rec_start,rec_end}
      - NOTIFY_URL=${NOTIFY_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_NOTIFY_PHOTO=${TELEGRAM_NOTIFY_PHOTO:-true}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
      - MONITOR_WORKERS=${MONITOR_WORKERS:-2}
      - ONLINE_CHECK_INTERVAL=${ONLINE_CHECK_INTERVAL:-30}
      - OFFLINE_CHECK_INTERVAL=${OFFLINE_CHECK_INTERVAL:-60}
      - ERROR_CHECK_INTERVAL=${ERROR_CHECK_INTERVAL:-120}
      - OFFLINE_CONFIRMATIONS=${OFFLINE_CONFIRMATIONS:-3}
      - OFFLINE_CONFIRM_INTERVAL=${OFFLINE_CONFIRM_INTERVAL:-5}
      - RECORDER_OFFLINE_GRACE_SECONDS=${RECORDER_OFFLINE_GRACE_SECONDS:-15}
      - LIVE_STREAM_BUFFER_BYTES=${LIVE_STREAM_BUFFER_BYTES:-4194304}
      - PREVIEW_STARTUP_TIMEOUT_SECONDS=${PREVIEW_STARTUP_TIMEOUT_SECONDS:-120}
      - PREVIEW_IDLE_TIMEOUT_SECONDS=${PREVIEW_IDLE_TIMEOUT_SECONDS:-180}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-1932735283}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  recorder-data:
    driver: local
